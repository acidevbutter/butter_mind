[tool.poetry]
name = "butter-mind"
version = "0.1.0"
description = "DevButter backend API — chat, guided budget/diagnosis chatbot, and RAG knowledge base"
authors = ["DevButter <contato@devbutter.com.br>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
sqlalchemy = "^2.0.35"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
pgvector = "^0.3.6"
greenlet = "^3.1.0"
openai = "^1.50.0"
typer = "^0.12.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
aiosqlite = "^0.20.0"

[tool.poetry.scripts]
app = "app.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
# pgvector ships no type information.
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests take untyped pytest fixtures and lean on runtime validation (Pydantic,
# monkeypatch) over static typing by design -- not held to the same strict
# bar as application code.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
implicit_reexport = true
strict_optional = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
