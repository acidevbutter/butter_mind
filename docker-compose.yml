services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: butter_mind
      POSTGRES_USER: butter_mind
      POSTGRES_PASSWORD: butter_mind
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U butter_mind"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      devbutter_shared:
        aliases:
          - mind-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app

volumes:
  pgdata:

networks:
  default:
  devbutter_shared:
    external: true
