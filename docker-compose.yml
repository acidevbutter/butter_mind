services:
  api:
    build: .
    env_file: .env
    ports:
      - "8001:8000"
    volumes:
      - ./app:/app/app
    networks:
      default:
      devbutter_shared:
        aliases:
          - mind-api
    develop:
      watch:
        - path: ./app
          action: sync+restart
          target: /app/app

networks:
  default:
  # shared-postgres lives in the infra/ compose stack -- bring that up first:
  # `docker network create devbutter_shared` then
  # `docker compose -f infra/docker-compose.yml up -d shared-postgres`.
  devbutter_shared:
    external: true
